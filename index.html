<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Empire</title>

<style>
:root {
    --bg: #07140e;
    --panel: #102c1d;
    --panel2: #173d28;
    --green: #51e889;
    --darkGreen: #168347;
    --yellow: #ffd866;
    --text: #f4fff7;
    --muted: #a6cbb2;
    --danger: #ff6575;
    --border: rgba(100,255,160,.2);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 20% 0%, rgba(60,220,120,.18), transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(255,215,90,.08), transparent 35%),
        var(--bg);
}

button {
    font-family: inherit;
}

.game {
    width: min(1200px, 100%);
    margin: auto;
    padding: 20px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;

    padding: 20px;
    margin-bottom: 20px;

    background: rgba(8,28,18,.92);
    border: 1px solid var(--border);
    border-radius: 24px;

    box-shadow: 0 20px 50px rgba(0,0,0,.3);
}

h1 {
    margin: 0;
    color: var(--green);
    font-size: clamp(2rem,5vw,3rem);
}

.subtitle {
    margin-top: 7px;
    color: var(--muted);
}

.money-area {
    text-align: right;
}

.money {
    color: var(--yellow);
    font-size: clamp(2rem,5vw,2.8rem);
    font-weight: 900;
}

.income {
    margin-top: 4px;
    color: var(--green);
    font-weight: bold;
}

.main {
    display: grid;
    grid-template-columns: minmax(300px,.85fr) minmax(380px,1.3fr);
    gap: 20px;
}

.panel {
    padding: 22px;

    background: rgba(16,44,29,.95);
    border: 1px solid var(--border);
    border-radius: 24px;

    box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.click-panel {
    position: relative;

    min-height: 560px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    overflow: hidden;
}

.glow {
    position: absolute;

    width: 300px;
    height: 300px;

    background: rgba(70,255,140,.10);
    border-radius: 50%;

    filter: blur(30px);
}

.bill {
    position: relative;
    z-index: 2;

    width: min(320px,90%);
    height: 165px;

    border: 7px solid #d5f7df;
    border-radius: 18px;

    color: #08391b;

    background:
        radial-gradient(circle, #d8f8df 0 12%, transparent 13%),
        linear-gradient(135deg,#5edd89,#bceeca);

    box-shadow:
        0 15px 0 #136b39,
        0 28px 45px rgba(0,0,0,.35);

    cursor: pointer;

    transition:
        transform .08s,
        box-shadow .08s;
}

.bill:hover {
    filter: brightness(1.06);
}

.bill:active,
.bill.clicked {
    transform: translateY(11px);
    box-shadow:
        0 4px 0 #136b39,
        0 14px 25px rgba(0,0,0,.3);
}

.dollar {
    display: block;
    font-size: 5rem;
    font-weight: 900;
    line-height: 1;
}

.billText {
    display: block;
    margin-top: 7px;

    font-weight: 900;
    letter-spacing: 2px;
}

.clickInfo {
    position: relative;
    z-index: 2;

    margin-top: 32px;
    font-size: 1.1rem;
    font-weight: bold;
}

.clickInfo strong {
    color: var(--yellow);
}

.stats {
    position: relative;
    z-index: 2;

    width: 100%;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;

    margin-top: 25px;
}

.stat {
    padding: 13px;

    background: rgba(0,0,0,.22);
    border: 1px solid var(--border);
    border-radius: 14px;
}

.statLabel {
    color: var(--muted);
    font-size: .75rem;
    text-transform: uppercase;
}

.statValue {
    margin-top: 5px;
    font-weight: 900;
}

.tabs {
    display: flex;
    gap: 7px;

    margin-bottom: 15px;
    padding: 5px;

    background: rgba(0,0,0,.22);
    border-radius: 14px;
}

.tab {
    flex: 1;

    padding: 11px 6px;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: var(--muted);

    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    background: var(--green);
    color: #062414;
}

.tabContent {
    display: none;
}

.tabContent.active {
    display: block;
}

.list {
    display: grid;
    gap: 11px;

    max-height: 585px;
    overflow-y: auto;
}

.item {
    display: grid;
    grid-template-columns: 58px 1fr auto;
    align-items: center;
    gap: 13px;

    padding: 14px;

    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 17px;
}

.icon {
    width: 58px;
    height: 58px;

    display: grid;
    place-items: center;

    border-radius: 14px;
    background: rgba(0,0,0,.22);

    font-size: 2rem;
}

.item h3 {
    margin: 0 0 5px;
    font-size: 1rem;
}

.item p {
    margin: 0;
    color: var(--muted);

    font-size: .82rem;
    line-height: 1.4;
}

.owned {
    display: block;

    margin-top: 6px;

    color: var(--yellow);
    font-size: .8rem;
    font-weight: bold;
}

.buy {
    min-width: 115px;

    padding: 12px 10px;

    border: 0;
    border-radius: 12px;

    background: var(--green);
    color: #062514;

    font-weight: 900;
    cursor: pointer;

    transition: transform .12s;
}

.buy:hover:not(:disabled) {
    transform: scale(1.04);
}

.buy:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.achievement {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 14px;

    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 15px;

    opacity: .45;
}

.achievement.unlocked {
    opacity: 1;
    background: rgba(100,80,20,.3);
    border-color: rgba(255,215,90,.4);
}

.achievement .achIcon {
    font-size: 2rem;
}

.achievement h3 {
    margin: 0 0 4px;
}

.achievement p {
    margin: 0;
    color: var(--muted);
    font-size: .8rem;
}

.actions {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
    margin-top: 20px;
}

.action {
    padding: 11px 16px;

    color: white;

    background: #225c3a;

    border: 1px solid var(--border);
    border-radius: 11px;

    font-weight: bold;
    cursor: pointer;
}

.reset {
    background: #8f2937;
}

.saveStatus {
    color: var(--muted);
    font-size: .8rem;
}

.floatMoney {
    position: fixed;
    z-index: 999;

    pointer-events: none;

    color: var(--yellow);

    font-size: 1.4rem;
    font-weight: 900;

    text-shadow: 0 2px 5px black;

    animation: moneyFloat .85s forwards;
}

@keyframes moneyFloat {
    from {
        transform: translate(-50%,0);
        opacity: 1;
    }

    to {
        transform: translate(-50%,-90px);
        opacity: 0;
    }
}

.notification {
    position: fixed;

    top: 20px;
    left: 50%;

    z-index: 1000;

    width: min(430px,calc(100% - 30px));

    padding: 15px 20px;

    background: #16492d;

    border: 1px solid var(--green);
    border-radius: 14px;

    text-align: center;
    font-weight: bold;

    box-shadow: 0 15px 40px rgba(0,0,0,.4);

    transform: translate(-50%,-150%);
    transition: .3s;
}

.notification.show {
    transform: translate(-50%,0);
}

.modal {
    position: fixed;
    inset: 0;

    z-index: 2000;

    display: none;
    place-items: center;

    padding: 20px;

    background: rgba(0,0,0,.75);
}

.modal.show {
    display: grid;
}

.modalCard {
    width: min(440px,100%);

    padding: 30px;

    text-align: center;

    background: #123823;

    border: 1px solid var(--border);
    border-radius: 24px;
}

.modalIcon {
    font-size: 4rem;
}

.modalCard h2 {
    margin-bottom: 10px;
}

.modalCard p {
    color: var(--muted);
    line-height: 1.5;
}

.offlineMoney {
    margin: 20px 0;

    color: var(--yellow);

    font-size: 2rem;
    font-weight: 900;
}

.collect {
    width: 100%;

    padding: 14px;

    border: 0;
    border-radius: 13px;

    color: #062414;
    background: var(--green);

    font-weight: 900;
    cursor: pointer;
}

@media(max-width:800px) {

    .game {
        padding: 12px;
    }

    .topbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .money-area {
        text-align: left;
    }

    .main {
        grid-template-columns: 1fr;
    }

    .click-panel {
        min-height: 480px;
    }

    .item {
        grid-template-columns: 50px 1fr;
    }

    .icon {
        width: 50px;
        height: 50px;
    }

    .buy {
        grid-column: 1 / -1;
        width: 100%;
    }

    .actions {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div id="notification" class="notification"></div>

<div id="offlineModal" class="modal">
    <div class="modalCard">
        <div class="modalIcon">🌙</div>

        <h2>Welcome Back!</h2>

        <p id="offlineText">
            Your businesses made money while you were away.
        </p>

        <div id="offlineMoney" class="offlineMoney">$0</div>

        <button id="collectOffline" class="collect">
            Collect Money
        </button>
    </div>
</div>

<main class="game">

    <header class="topbar">

        <div>
            <h1>💵 Money Empire</h1>

            <div class="subtitle">
                Click. Invest. Upgrade. Get rich.
            </div>
        </div>

        <div class="money-area">

            <div id="money" class="money">$0</div>

            <div id="income" class="income">
                $0 per second
            </div>

        </div>

    </header>


    <section class="main">

        <!-- CLICKER -->

        <div class="panel click-panel">

            <div class="glow"></div>

            <button id="bill" class="bill">

                <span class="dollar">$</span>

                <span class="billText">
                    CLICK FOR MONEY
                </span>

            </button>

            <div class="clickInfo">
                Each click earns
                <strong id="clickValue">$1</strong>
            </div>

            <div class="stats">

                <div class="stat">
                    <div class="statLabel">
                        Total Earned
                    </div>

                    <div id="totalEarned" class="statValue">
                        $0
                    </div>
                </div>


                <div class="stat">
                    <div class="statLabel">
                        Clicks
                    </div>

                    <div id="clicks" class="statValue">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="statLabel">
                        Businesses
                    </div>

                    <div id="businessCount" class="statValue">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="statLabel">
                        Click Level
                    </div>

                    <div id="clickLevel" class="statValue">
                        1
                    </div>
                </div>

            </div>

        </div>


        <!-- SHOP -->

        <div class="panel">

            <div class="tabs">

                <button
                    class="tab active"
                    data-tab="businessTab">
                    Businesses
                </button>

                <button
                    class="tab"
                    data-tab="upgradeTab">
                    Upgrades
                </button>

                <button
                    class="tab"
                    data-tab="achievementTab">
                    Awards
                </button>

            </div>


            <div
                id="businessTab"
                class="tabContent active">

                <div
                    id="businessList"
                    class="list">
                </div>

            </div>


            <div
                id="upgradeTab"
                class="tabContent">

                <div
                    id="upgradeList"
                    class="list">
                </div>

            </div>


            <div
                id="achievementTab"
                class="tabContent">

                <div
                    id="achievementList"
                    class="list">
                </div>

            </div>


            <div class="actions">

                <button
                    id="save"
                    class="action">
                    Save Game
                </button>

                <span
                    id="saveStatus"
                    class="saveStatus">
                    Autosave enabled
                </span>

                <button
                    id="reset"
                    class="action reset">
                    Reset
                </button>

            </div>

        </div>

    </section>

</main>


<script>

const SAVE_KEY = "moneyEmpire_v2";

const businesses = [

    {
        id: "lemon",
        name: "Lemonade Stand",
        icon: "🍋",
        cost: 25,
        income: 1,
        description: "Start small and sell lemonade."
    },

    {
        id: "carwash",
        name: "Car Wash",
        icon: "🚗",
        cost: 150,
        income: 6,
        description: "Wash cars for steady cash."
    },

    {
        id: "foodtruck",
        name: "Food Truck",
        icon: "🚚",
        cost: 800,
        income: 25,
        description: "Serve food around the city."
    },

    {
        id: "store",
        name: "Retail Store",
        icon: "🏪",
        cost: 4500,
        income: 120,
        description: "Sell products all day."
    },

    {
        id: "factory",
        name: "Factory",
        icon: "🏭",
        cost: 25000,
        income: 600,
        description: "Mass produce products."
    },

    {
        id: "bank",
        name: "Bank",
        icon: "🏦",
        cost: 150000,
        income: 3200,
        description: "Turn money into even more money."
    },

    {
        id: "tech",
        name: "Tech Company",
        icon: "💻",
        cost: 900000,
        income: 18000,
        description: "Build software and digital services."
    },

    {
        id: "space",
        name: "Space Company",
        icon: "🚀",
        cost: 6000000,
        income: 110000,
        description: "Expand your empire into space."
    }

];


const upgrades = [

    {
        name: "Faster Fingers",
        icon: "👆",
        cost: 50,
        value: 2
    },

    {
        name: "Money Magnet",
        icon: "🧲",
        cost: 300,
        value: 5
    },

    {
        name: "Golden Mouse",
        icon: "🖱️",
        cost: 2000,
        value: 15
    },

    {
        name: "Diamond Click",
        icon: "💎",
        cost: 15000,
        value: 75
    },

    {
        name: "Super Click",
        icon: "⚡",
        cost: 100000,
        value: 400
    },

    {
        name: "Money Machine",
        icon: "🤑",
        cost: 1000000,
        value: 5000
    },

    {
        name: "Reality Breaker",
        icon: "🌌",
        cost: 25000000,
        value: 100000
    }

];


function defaultGame() {

    const owned = {};

    businesses.forEach(business => {

        owned[business.id] = 0;

    });


    return {

        money: 0,

        totalEarned: 0,

        clicks: 0,

        clickUpgrade: 0,

        businesses: owned,

        achievements: [],

        lastSaved: Date.now()

    };

}


let game = defaultGame();

let offlineReward = 0;


/* =========================
   ELEMENTS
========================= */

const moneyElement =
document.getElementById("money");

const incomeElement =
document.getElementById("income");

const clickValueElement =
document.getElementById("clickValue");

const totalEarnedElement =
document.getElementById("totalEarned");

const clicksElement =
document.getElementById("clicks");

const businessCountElement =
document.getElementById("businessCount");

const clickLevelElement =
document.getElementById("clickLevel");

const bill =
document.getElementById("bill");

const businessList =
document.getElementById("businessList");

const upgradeList =
document.getElementById("upgradeList");

const achievementList =
document.getElementById("achievementList");

const notification =
document.getElementById("notification");


/* =========================
   FORMATTING
========================= */

function formatMoney(number) {

    if (!Number.isFinite(number)) {

        return "$0";

    }

    const suffixes = [

        [1e15,"Q"],
        [1e12,"T"],
        [1e9,"B"],
        [1e6,"M"],
        [1e3,"K"]

    ];


    for (const [amount,suffix] of suffixes) {

        if (Math.abs(number) >= amount) {

            let value = number / amount;

            let text =
            value >= 100
            ? value.toFixed(0)
            : value.toFixed(2);

            text =
            text.replace(/\.00$/,"");

            return "$" + text + suffix;

        }

    }

    return "$" +
    Math.floor(number).toLocaleString();

}


/* =========================
   MONEY CALCULATIONS
========================= */

function currentClickValue() {

    if (game.clickUpgrade === 0) {

        return 1;

    }

    return upgrades[
        game.clickUpgrade - 1
    ].value;

}


function businessPrice(business) {

    const owned =
    game.businesses[business.id] || 0;

    return Math.floor(
        business.cost *
        Math.pow(1.15,owned)
    );

}


function moneyPerSecond() {

    let total = 0;

    businesses.forEach(business => {

        const owned =
        game.businesses[business.id] || 0;

        total +=
        business.income * owned;

    });

    return total;

}


function totalBusinesses() {

    let total = 0;

    Object.values(game.businesses)
    .forEach(amount => {

        total += Number(amount) || 0;

    });

    return total;

}


function giveMoney(amount) {

    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        return;

    }

    game.money += amount;

    game.totalEarned += amount;

}


/* =========================
   BUSINESS BUYING
========================= */

function buyBusiness(id) {

    const business =
    businesses.find(
        business =>
        business.id === id
    );


    if (!business) {

        return;

    }


    /*
       IMPORTANT:
       Get the price RIGHT NOW.

       We do not use an old price
       from a previously rendered
       button.
    */

    const price =
    businessPrice(business);


    if (game.money < price) {

        showNotification(
            "Not enough money!"
        );

        return;

    }


    game.money -= price;


    game.businesses[id] =
    (game.businesses[id] || 0) + 1;


    checkAchievements();

    render();

    saveGame(false);


    showNotification(
        business.icon +
        " Bought " +
        business.name +
        "!"
    );

}


/* =========================
   CLICK UPGRADES
========================= */

function buyUpgrade(index) {

    /*
       Only the NEXT upgrade
       can be purchased.
    */

    if (index !== game.clickUpgrade) {

        return;

    }


    const upgrade =
    upgrades[index];


    if (!upgrade) {

        return;

    }


    if (game.money < upgrade.cost) {

        showNotification(
            "Not enough money!"
        );

        return;

    }


    game.money -= upgrade.cost;

    game.clickUpgrade++;


    checkAchievements();

    render();

    saveGame(false);


    showNotification(
        upgrade.icon +
        " " +
        upgrade.name +
        " purchased!"
    );

}


/* =========================
   RENDER BUSINESS SHOP
========================= */

function renderBusinesses() {

    /*
       Every time prices change,
       completely rebuild the
       business buttons.

       Each button gets a fresh
       click listener.
    */

    businessList.replaceChildren();


    businesses.forEach(business => {

        const owned =
        game.businesses[business.id] || 0;

        const price =
        businessPrice(business);


        const item =
        document.createElement("div");

        item.className = "item";


        const icon =
        document.createElement("div");

        icon.className = "icon";

        icon.textContent =
        business.icon;


        const info =
        document.createElement("div");


        const title =
        document.createElement("h3");

        title.textContent =
        business.name;


        const description =
        document.createElement("p");

        description.textContent =
        business.description;


        const ownedText =
        document.createElement("span");

        ownedText.className =
        "owned";

        ownedText.textContent =
        "Owned: " +
        owned +
        " • " +
        formatMoney(
            business.income * owned
        ) +
        "/sec";


        info.appendChild(title);

        info.appendChild(description);

        info.appendChild(ownedText);


        const button =
        document.createElement("button");

        button.className = "buy";

        button.innerHTML =
        "Buy<br>" +
        formatMoney(price);


        button.disabled =
        game.money < price;


        /*
           Read the current price
           again when clicked.
        */

        button.addEventListener(
            "click",
            () => {

                buyBusiness(
                    business.id
                );

            }
        );


        item.appendChild(icon);

        item.appendChild(info);

        item.appendChild(button);


        businessList.appendChild(
            item
        );

    });

}


/* =========================
   RENDER UPGRADES
========================= */

function renderUpgrades() {

    upgradeList.replaceChildren();


    upgrades.forEach(
        (upgrade,index) => {

        const purchased =
        index < game.clickUpgrade;

        const next =
        index === game.clickUpgrade;


        const item =
        document.createElement("div");

        item.className = "item";


        const icon =
        document.createElement("div");

        icon.className = "icon";

        icon.textContent =
        upgrade.icon;


        const info =
        document.createElement("div");


        const title =
        document.createElement("h3");

        title.textContent =
        upgrade.name;


        const description =
        document.createElement("p");

        description.textContent =
        "Earn " +
        formatMoney(upgrade.value) +
        " every click.";


        const level =
        document.createElement("span");

        level.className = "owned";

        level.textContent =
        "Upgrade Level " +
        (index + 1);


        info.appendChild(title);

        info.appendChild(description);

        info.appendChild(level);


        const button =
        document.createElement("button");

        button.className = "buy";


        if (purchased) {

            button.textContent =
            "Purchased";

            button.disabled = true;

        }

        else if (!next) {

            button.textContent =
            "Locked";

            button.disabled = true;

        }

        else {

            button.innerHTML =
            "Buy<br>" +
            formatMoney(
                upgrade.cost
            );


            button.disabled =
            game.money <
            upgrade.cost;


            button.addEventListener(
                "click",
                () => {

                    buyUpgrade(index);

                }
            );

        }


        item.appendChild(icon);

        item.appendChild(info);

        item.appendChild(button);


        upgradeList.appendChild(
            item
        );

    });

}


/* =========================
   ACHIEVEMENTS
========================= */

const achievements = [

    {
        id: "click1",
        icon: "🪙",
        name: "First Dollar",
        description:
        "Click your first dollar.",
        condition() {
            return game.clicks >= 1;
        }
    },

    {
        id: "click100",
        icon: "👆",
        name: "Clicking Machine",
        description:
        "Click 100 times.",
        condition() {
            return game.clicks >= 100;
        }
    },

    {
        id: "business1",
        icon: "💼",
        name: "Entrepreneur",
        description:
        "Buy your first business.",
        condition() {
            return totalBusinesses() >= 1;
        }
    },

    {
        id: "business10",
        icon: "🏙️",
        name: "Business Empire",
        description:
        "Own 10 businesses.",
        condition() {
            return totalBusinesses() >= 10;
        }
    },

    {
        id: "1000",
        icon: "💵",
        name: "Four Figures",
        description:
        "Earn $1,000 total.",
        condition() {
            return game.totalEarned >= 1000;
        }
    },

    {
        id: "million",
        icon: "👑",
        name: "Millionaire",
        description:
        "Earn $1,000,000 total.",
        condition() {
            return game.totalEarned >= 1000000;
        }
    },

    {
        id: "income",
        icon: "📈",
        name: "Income King",
        description:
        "Make $10,000 per second.",
        condition() {
            return moneyPerSecond() >= 10000;
        }
    }

];


function checkAchievements() {

    achievements.forEach(
        achievement => {

        if (
            !game.achievements.includes(
                achievement.id
            ) &&
            achievement.condition()
        ) {

            game.achievements.push(
                achievement.id
            );


            showNotification(
                "🏆 Achievement: " +
                achievement.name
            );

        }

    });

}


function renderAchievements() {

    achievementList.replaceChildren();


    achievements.forEach(
        achievement => {

        const unlocked =
        game.achievements.includes(
            achievement.id
        );


        const item =
        document.createElement("div");

        item.className =
        "achievement" +
        (unlocked
            ? " unlocked"
            : "");


        item.innerHTML = `
            <div class="achIcon">
                ${
                    unlocked
                    ? achievement.icon
                    : "🔒"
                }
            </div>

            <div>
                <h3>
                    ${achievement.name}
                </h3>

                <p>
                    ${achievement.description}
                </p>
            </div>
        `;


        achievementList.appendChild(
            item
        );

    });

}


/* =========================
   MAIN RENDER
========================= */

function render() {

    moneyElement.textContent =
    formatMoney(game.money);


    incomeElement.textContent =
    formatMoney(
        moneyPerSecond()
    ) +
    " per second";


    clickValueElement.textContent =
    formatMoney(
        currentClickValue()
    );


    totalEarnedElement.textContent =
    formatMoney(
        game.totalEarned
    );


    clicksElement.textContent =
    game.clicks.toLocaleString();


    businessCountElement.textContent =
    totalBusinesses()
    .toLocaleString();


    clickLevelElement.textContent =
    (game.clickUpgrade + 1)
    .toLocaleString();


    renderBusinesses();

    renderUpgrades();

    renderAchievements();

}


/* =========================
   CLICKING
========================= */

bill.addEventListener(
    "click",
    event => {

        const amount =
        currentClickValue();


        giveMoney(amount);

        game.clicks++;


        bill.classList.add(
            "clicked"
        );


        setTimeout(
            () => {

                bill.classList.remove(
                    "clicked"
                );

            },
            80
        );


        floatingMoney(
            event,
            amount
        );


        checkAchievements();

        render();

    }
);


function floatingMoney(
    event,
    amount
) {

    const element =
    document.createElement("div");


    element.className =
    "floatMoney";


    element.textContent =
    "+" +
    formatMoney(amount);


    const rect =
    bill.getBoundingClientRect();


    const x =
    event.clientX ||
    rect.left +
    rect.width / 2;


    const y =
    event.clientY ||
    rect.top +
    rect.height / 2;


    element.style.left =
    x + "px";


    element.style.top =
    y + "px";


    document.body.appendChild(
        element
    );


    setTimeout(
        () => {

            element.remove();

        },
        850
    );

}


/* =========================
   PASSIVE INCOME
========================= */

/*
    Income updates 10 times
    every second.

    This gives smoother money
    counting.
*/

setInterval(
    () => {

        const perSecond =
        moneyPerSecond();


        if (perSecond > 0) {

            giveMoney(
                perSecond / 10
            );

            checkAchievements();

            render();

        }

    },
    100
);


/* =========================
   SAVING
========================= */

function saveGame(showMessage = true) {

    game.lastSaved =
    Date.now();


    try {

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(game)
        );


        const date =
        new Date();


        document.getElementById(
            "saveStatus"
        ).textContent =
        "Saved " +
        date.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


        if (showMessage) {

            showNotification(
                "Game Saved!"
            );

        }

    }

    catch {

        showNotification(
            "Saving failed."
        );

    }

}


/* =========================
   LOADING
========================= */

function loadGame() {

    const saved =
    localStorage.getItem(
        SAVE_KEY
    );


    if (!saved) {

        render();

        return;

    }


    try {

        const data =
        JSON.parse(saved);


        const defaults =
        defaultGame();


        game = {

            ...defaults,

            ...data,

            money:
            Number(data.money) || 0,

            totalEarned:
            Number(
                data.totalEarned
            ) || 0,

            clicks:
            Number(data.clicks) || 0,

            clickUpgrade:
            Math.max(
                0,
                Math.min(
                    Number(
                        data.clickUpgrade
                    ) || 0,
                    upgrades.length
                )
            ),

            businesses: {
                ...defaults.businesses,
                ...(data.businesses || {})
            },

            achievements:
            Array.isArray(
                data.achievements
            )
            ? data.achievements
            : [],

            lastSaved:
            Number(
                data.lastSaved
            ) ||
            Date.now()

        };


        calculateOffline();


        checkAchievements();

        render();

    }

    catch {

        game =
        defaultGame();

        render();

    }

}


/* =========================
   OFFLINE INCOME
========================= */

function calculateOffline() {

    const now =
    Date.now();


    const awayTime =
    Math.max(
        0,
        now - game.lastSaved
    );


    /*
        Maximum offline earning
        time: 24 hours.
    */

    const maximum =
    24 *
    60 *
    60 *
    1000;


    const counted =
    Math.min(
        awayTime,
        maximum
    );


    offlineReward =
    moneyPerSecond() *
    (counted / 1000);


    /*
        Only show the popup if
        they were gone at least
        five seconds and actually
        earned something.
    */

    if (
        counted >= 5000 &&
        offlineReward >= 1
    ) {

        document.getElementById(
            "offlineText"
        ).textContent =
        "Your businesses worked while you were away.";


        document.getElementById(
            "offlineMoney"
        ).textContent =
        formatMoney(
            offlineReward
        );


        document.getElementById(
            "offlineModal"
        ).classList.add(
            "show"
        );

    }

    else {

        offlineReward = 0;

    }

}


document.getElementById(
    "collectOffline"
).addEventListener(
    "click",
    () => {

        if (
            offlineReward > 0
        ) {

            giveMoney(
                offlineReward
            );

        }


        offlineReward = 0;


        document.getElementById(
            "offlineModal"
        ).classList.remove(
            "show"
        );


        checkAchievements();

        render();

        saveGame(false);

    }
);


/* =========================
   SAVE BUTTON
========================= */

document.getElementById(
    "save"
).addEventListener(
    "click",
    () => {

        saveGame(true);

    }
);


/* =========================
   RESET
========================= */

document.getElementById(
    "reset"
).addEventListener(
    "click",
    () => {

        const confirmReset =
        confirm(
            "RESET your entire Money Empire?\n\nThis cannot be undone."
        );


        if (!confirmReset) {

            return;

        }


        localStorage.removeItem(
            SAVE_KEY
        );


        game =
        defaultGame();


        offlineReward = 0;


        document.getElementById(
            "offlineModal"
        ).classList.remove(
            "show"
        );


        render();

        saveGame(false);


        showNotification(
            "Game reset!"
        );

    }
);


/* =========================
   TABS
========================= */

document
.querySelectorAll(".tab")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".tab")
            .forEach(tab => {

                tab.classList.remove(
                    "active"
                );

            });


            document
            .querySelectorAll(
                ".tabContent"
            )
            .forEach(content => {

                content.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            document.getElementById(
                button.dataset.tab
            ).classList.add(
                "active"
            );

        }
    );

});


/* =========================
   NOTIFICATIONS
========================= */

function showNotification(message) {

    notification.textContent =
    message;


    notification.classList.add(
        "show"
    );


    clearTimeout(
        showNotification.timeout
    );


    showNotification.timeout =
    setTimeout(
        () => {

            notification.classList.remove(
                "show"
            );

        },
        2200
    );

}


/* =========================
   AUTOSAVE
========================= */

setInterval(
    () => {

        saveGame(false);

    },
    10000
);


/*
    Save when leaving page.
*/

window.addEventListener(
    "beforeunload",
    () => {

        saveGame(false);

    }
);


/*
    Save when switching tabs
    or minimizing browser.
*/

document.addEventListener(
    "visibilitychange",
    () => {

        if (document.hidden) {

            saveGame(false);

        }

    }
);


/* =========================
   START GAME
========================= */

loadGame();

</script>

</body>
</html>
